[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "liars-are-information"
version = "3.0.0"
description = "Receiver-anchored channel estimation (RACE) and adversarial informativeness pooling (AIP) for Byzantine-robust multi-agent LLM aggregation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "scipy>=1.13",
    "sympy>=1.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "datasets>=2.20",
    # LOWER BOUND IS LOAD-BEARING. google/gemma-4-31B-it's tokenizer_config uses
    # a schema (list-valued extra_special_tokens, backend="tokenizers") that
    # transformers 4.x cannot parse -- 4.57.6 falls back to the Gemma-1
    # GemmaTokenizerFast and dies with "'list' object has no attribute 'keys'".
    # vllm 0.19.1 in turn excludes 5.0-5.4 and 5.5.0, so the usable floor is
    # 5.5.1. Verified: all seven roster tokenizers and chat templates load on
    # 5.16.1, and aip.models.inference._as_token_ids already normalises the
    # BatchEncoding that 5.x returns from apply_chat_template(tokenize=True).
    "transformers>=5.5.1,!=5.5.0",
    "matplotlib>=3.9",
    "structlog>=24.1",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
# Publishing the artifact to the Hugging Face Hub (scripts/hf_push.py). Kept
# optional: nothing in the study needs it, and the offline phases must stay
# installable without network credentials.
hub = [
    "huggingface-hub>=1.20",
]
# v3 extras: figures/videos, statistics tables, and the live CPU swarm (E8).
v3 = [
    "scikit-learn>=1.5",
    "imageio-ffmpeg>=0.5",
    "tabulate>=0.9",
]
live = [
    "torch>=2.4",
    "transformers>=4.50",
    "accelerate>=0.30",
]
# Installed separately before Phase A; kept out of the default set so that
# offline phases (B, C, E) and the test suite run on a CPU-only box.
#
# PINNED, deliberately. Two constraints fix this version, and both were checked
# empirically on the H100 node (see results/phase_0_report.md):
#
#   1. DRIVER. This node runs 570.195.03, which caps at CUDA 12.8. vllm 0.19.1
#      resolves torch==2.10.0, whose wheels depend on nvidia-cuda-runtime-cu12
#      ==12.8.90 -- exactly at the cap. vllm >= 0.20.0 resolves torch==2.11.0,
#      a CUDA 13 build with no cu12 runtime dependency, which cannot initialise
#      on a 12.8 driver.
#   2. ARCHITECTURES. Gemma4ForConditionalGeneration first appears in vllm's
#      model registry at 0.19.0; 0.18.1 and the previous 0.17.0 pin do not have
#      it. Olmo3ForCausalLM and Qwen3_5ForConditionalGeneration are present from
#      0.17.0 onward.
#
# So 0.19.1 is the only release satisfying both: the newest that still runs on
# this driver, and the oldest of those that loads every model in the registry.
# Do not bump without re-checking both constraints.
gpu = [
    "vllm==0.19.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aip", "src/lai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m \"not slow\""
markers = [
    "slow: tests that download datasets or take >10s",
    "gpu: tests that require a CUDA device and vLLM",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
